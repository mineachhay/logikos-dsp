# logikos-dsp — vhost for the shared logikos-gateway.
#
# INSTALL:
#   cp deploy/dsp.conf ../logikos-gateway/conf.d/dsp.conf
#   cd ../logikos-gateway && docker compose exec nginx nginx -t && \
#     docker compose exec nginx nginx -s reload
#
# The conf.d mount is read-only, so the file must exist on the host before
# the reload. Always `nginx -t` first — a syntax error on restart takes
# asset, chms and school down with it.
#
# Upstreams (published host ports, reached via host.docker.internal):
#   4000 → logikos-dsp-backend-1    (Fastify API)
#   8080 → logikos-dsp-dashboard-1  (nginx serving the built React SPA)
#
# The dashboard bundle has https://dsp.logikos.dev/api baked in at IMAGE
# BUILD TIME (VITE_BACKEND_URL → DASHBOARD_BACKEND_URL build arg) — Vite
# inlines it, so changing this hostname means rebuilding the dashboard
# image, not just editing this file.

server {
    listen 443 ssl;
    http2 on;
    server_name dsp.logikos.dev;

    ssl_certificate     /etc/nginx/certs/logikos.dev.crt;
    ssl_certificate_key /etc/nginx/certs/logikos.dev.key;

    client_max_body_size 100M;

    # --- Agent-facing endpoints: deliberately NOT exposed to the internet ---
    #
    # These three authenticate machines via Agent.key, not a user session,
    # and /agents/register takes no credential at all — anyone who can reach
    # them could register an agent or inject fabricated file events and
    # alerts. The agent container talks to the backend directly over the
    # compose network (BACKEND_URL=http://backend:4000), so it never comes
    # through this vhost and nothing breaks by closing them here.
    #
    # To run an agent on a REMOTE machine later, delete the two blocks below
    # and put real authentication in front of them first.
    #
    # Regex and exact-match locations both take precedence over the /api/
    # prefix location below, so these win regardless of file order.
    location ~ ^/api/(ingest|agent-commands) {
        return 403;
    }
    location = /api/agents/register {
        return 403;
    }

    # --- Backend API ---
    #
    # The backend serves its routes at the root (/auth/login, /alerts, ...)
    # with no /api prefix of its own. The trailing slash on proxy_pass
    # strips the /api/ prefix: /api/auth/login → /auth/login upstream.
    # Keeping the API same-origin with the SPA is what lets the httpOnly
    # SameSite=Lax session cookie work without any CORS exemption.
    location /api/ {
        proxy_pass http://host.docker.internal:4000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Dashboard (static SPA) ---
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
