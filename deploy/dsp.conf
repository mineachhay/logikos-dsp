# logikos-dsp — vhost for the shared logikos-gateway.
#
# INSTALL:
#   cp deploy/dsp.conf ../logikos-gateway/conf.d/dsp.conf
#   cd ../logikos-gateway && docker compose exec nginx nginx -t && \
#     docker compose exec nginx nginx -s reload
#
# The conf.d mount is read-only, so the file must exist on the host before
# the reload. Always `nginx -t` first — a syntax error on restart takes
# asset, chms and school down with it.
#
# Upstreams (published host ports, reached via host.docker.internal):
#   4000 → logikos-dsp-backend-1    (Fastify API)
#   8080 → logikos-dsp-dashboard-1  (nginx serving the built React SPA)
#
# The dashboard bundle has https://dsp.logikos.dev/api baked in at IMAGE
# BUILD TIME (VITE_BACKEND_URL → DASHBOARD_BACKEND_URL build arg) — Vite
# inlines it, so changing this hostname means rebuilding the dashboard
# image, not just editing this file.

# Rate-limit zone for agent enrollment (used in the server block below).
#
# conf.d/*.conf is included inside nginx's http block, so the file's own top
# level IS http context — which is where limit_req_zone has to live. Declaring
# it here rather than in the gateway's shared nginx.conf keeps the whole change
# inside the one file logikos-dsp owns: nothing about this vhost can break the
# other three projects, and applying it is a single copy.
#
# Declaring a zone allocates shared memory and nothing else; it affects only
# the location that opts in with limit_req.
limit_req_zone $binary_remote_addr zone=dsp_register:1m rate=6r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name dsp.logikos.dev;

    ssl_certificate     /etc/nginx/certs/logikos.dev.crt;
    ssl_certificate_key /etc/nginx/certs/logikos.dev.key;

    client_max_body_size 100M;

    # --- Agent enrollment: open, but rate limited ---
    #
    # /api/ingest/* and /api/agent-commands* used to 403 here, from before
    # agent authentication existed, when /agents/register took no credential
    # at all and anyone who could reach these could inject fabricated file
    # events. They now require a per-agent secret that the backend rotates on
    # every registration (auth/agentAuth.ts), so they are ordinary
    # authenticated endpoints and fall through to the /api/ block below.
    #
    # Registration is the exception worth guarding: it is authenticated by
    # AGENT_ENROLL_TOKEN, one shared secret for the whole deployment, so it
    # is the only route where an attacker gets unlimited guesses at a single
    # value. Six attempts a minute per IP makes that hopeless against a
    # 32-byte token while leaving real agents — which register at startup and
    # after a 401 — far below the limit. Rejections are 429, not 403, so a
    # throttled agent's log says what actually happened.
    #
    # The zone itself is declared at the top of this file.
    # Exact-match locations take precedence over the /api/ prefix location
    # below, so this wins regardless of file order.
    location = /api/agents/register {
        limit_req zone=dsp_register burst=3 nodelay;
        limit_req_status 429;

        # Exact-match location, so the URI must be written out in full —
        # the trailing-slash prefix-stripping trick below only works for a
        # prefix location.
        proxy_pass http://host.docker.internal:4000/agents/register;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend API ---
    #
    # The backend serves its routes at the root (/auth/login, /alerts, ...)
    # with no /api prefix of its own. The trailing slash on proxy_pass
    # strips the /api/ prefix: /api/auth/login → /auth/login upstream.
    # Keeping the API same-origin with the SPA is what lets the httpOnly
    # SameSite=Lax session cookie work without any CORS exemption.
    location /api/ {
        proxy_pass http://host.docker.internal:4000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Dashboard (static SPA) ---
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
