# Serves the built dashboard (packages/dashboard/Dockerfile runtime stage).
#
# index.html must be revalidated on every load: with nginx's defaults it went
# out with no Cache-Control, so browsers could keep reusing an old copy — and
# with it the old bundle — after a deploy; a new "My account" link simply
# didn't exist for someone until a hard refresh. The bundle files under
# /assets/ carry a content hash in their names, so they never change and can be
# cached for good.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        index  index.html;
    }
}
