# Dev workflow (`pnpm db:up`) targets just the `postgres` service and is
# unaffected by the services below. `docker compose up` with no service
# name brings up the full product — backend, agent, classification,
# dashboard — for a single-host deployment or a from-scratch demo.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logikos
      POSTGRES_PASSWORD: logikos
      POSTGRES_DB: logikos_dsp
    ports:
      # Loopback only: nothing outside this host needs Postgres — the backend
      # and classification worker reach it over the compose network. Published
      # on 0.0.0.0 it was reachable from the whole LAN with the default
      # credentials, and Docker's port publishing writes its own iptables
      # rules that bypass ufw. Local dev (pnpm db:up, psql, prisma) is
      # unaffected.
      - "127.0.0.1:5432:5432"
    volumes:
      - logikos_dsp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logikos -d logikos_dsp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Every other service is `unless-stopped`; without the same here, a host
    # reboot brings the stack back up with no database and the other four
    # restart-loop against it.
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    # Secrets (JWT_SECRET, ADMIN_EMAIL/PASSWORD, RESPONSE_WEBHOOK_URL) come
    # from the same .env dev already uses — see README's Quickstart for how
    # to create it. DATABASE_URL is overridden below: .env's copy points at
    # `localhost`, which is wrong inside the compose network (services
    # reach each other by service name).
    #
    # BACKEND_ENV_FILE lets a host that also does dev work give the deployment
    # its own secrets: otherwise `pnpm dev:backend` and this container share
    # one JWT_SECRET and one NODE_ENV=production (which sets the cookie's
    # Secure flag and breaks login over plain-http localhost).
    env_file:
      - ${BACKEND_ENV_FILE:-packages/backend/.env}
    environment:
      DATABASE_URL: postgresql://logikos:logikos@postgres:5432/logikos_dsp
      PORT: 4000
      # From the root .env, shared with the agent service below so the two
      # can't drift. Empty makes the backend refuse to start, with a message.
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-}
    ports:
      # PUBLISH_ADDR: behind a reverse proxy, bind to the address the proxy
      # connects to (e.g. the docker0 bridge for host.docker.internal) so the
      # proxy is the only way in. On 0.0.0.0 anyone who can reach this host
      # skips the proxy — its blocks on /ingest, /agent-commands and
      # /agents/register, and the X-Forwarded-For that trustProxy believes.
      - "${PUBLISH_ADDR:-0.0.0.0}:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    # Agent.key is derived from sha256(hostname:local:watchPath) so the Go and
    # TypeScript agents register as the same row. In a container the default
    # hostname is the random container ID, so every recreate minted a NEW
    # Agent row and orphaned the previous one's history. Pinning it keeps the
    # identity stable across redeploys.
    hostname: dsp-agent
    environment:
      BACKEND_URL: http://backend:4000
      WATCH_PATH: /data
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-}
      # SOURCE_TYPE/SMB_*/M365_* — set here to point the agent at a real
      # share instead of the local bind mount below; see README.
    volumes:
      - ${WATCH_PATH_HOST:-./data/watched}:/data
    depends_on:
      - backend
    restart: unless-stopped

  classification:
    build:
      context: .
      dockerfile: packages/classification/Dockerfile
    environment:
      DATABASE_URL: postgresql://logikos:logikos@postgres:5432/logikos_dsp
    volumes:
      - classification_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        # Must be reachable from the browser, not from inside the compose
        # network — see packages/dashboard/Dockerfile. Override for any
        # deployment where the backend isn't on localhost:4000 from the
        # browser's point of view.
        VITE_BACKEND_URL: ${DASHBOARD_BACKEND_URL:-http://localhost:4000}
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Local sink for RESPONSE_WEBHOOK_URL. Without something listening, approving
  # a WEBHOOK_NOTIFICATION goes straight to FAILED — see deploy/webhook-logger.mjs.
  # Replace RESPONSE_WEBHOOK_URL in packages/backend/.env with a real Slack or
  # Telegram endpoint and this service can be removed.
  webhook-logger:
    image: node:24-bookworm-slim
    command: node /app/webhook-logger.mjs
    volumes:
      - ./deploy/webhook-logger.mjs:/app/webhook-logger.mjs:ro
    restart: unless-stopped

volumes:
  logikos_dsp_pgdata:
  classification_cache:
